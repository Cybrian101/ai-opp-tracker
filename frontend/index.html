<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PathFound: an AI career copilot. Know who you could become, and exactly how to get the job." />
    <meta name="theme-color" content="#07161b" />
    <script>
      // Apply the saved theme before first paint so there is no flash. Dark is the default.
      try {
        var t = localStorage.getItem('pf-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PathFound</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
